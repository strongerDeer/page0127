  색은 세 토큰만 쓴다:
  - #1E69CB = brand/symbol-bg  (= blue/600)
  - #FFFFFF = brand/symbol-mark (= gray/0)
  - #6EE7B7 = brand/accent      (= mint/300)

  아웃라인이 **배경과 같은 파랑**인 게 핵심이다. 16px에서 선 굵기는 실제 0.25px까지 줄어드는데,
  배경색과 같은 색이라 뭉개져도 흰 책이 살짝 얇아 보일 뿐 회색 얼룩이 생기지 않는다.
  (아웃라인을 네이비 같은 제3의 색으로 두면 그 회색이 흰 면적을 먹어 형태가 흐려진다)

  ⚠️ `app/apple-icon.tsx` 가 같은 형태를 JSX 로 다시 그린다 — 한쪽을 고치면 다른 쪽도 고쳐야 한다.
