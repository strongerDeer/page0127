version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "00:30"
      timezone: Asia/Seoul
    open-pull-requests-limit: 5
    # TypeScript 7 은 컴파일러가 Go 로 재작성되면서 기존 JS 컴파일러 API 가 빠졌다.
    # typescript-eslint(#10940)·Next.js 가 아직 그 API 에 의존해서 TS 7 로 올리면 lint·build 가 통째로 죽는다.
    # 두 도구가 지원을 발표하면 이 항목을 지우고 메이저 업그레이드를 별도 PR 로 검증한다.
    ignore:
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
      # ESLint 10 은 규칙 컨텍스트에서 `context.getFilename()` 을 제거했는데
      # eslint-plugin-react 가 아직 그 API 에 의존한다. 올리면 lint 가 통째로 죽는다:
      #   TypeError: Error while loading rule 'react/display-name':
      #   contextOrFilename.getFilename is not a function
      # (PR #73 에서 실측 — Lint 작업이 47초 만에 exit 2)
      # 플러그인이 ESLint 10 지원을 발표하면 이 항목을 지우고 메이저 업그레이드를
      # 별도 PR 로 검증한다. typescript 와 같은 이유·같은 처리다.
      - dependency-name: eslint
        update-types:
          - version-update:semver-major
    groups:
      production-minor-patch:
        dependency-type: production
        update-types:
          - minor
          - patch
      development-minor-patch:
        dependency-type: development
        update-types:
          - minor
          - patch
