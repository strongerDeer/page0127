version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "00:30"
      timezone: Asia/Seoul
    open-pull-requests-limit: 5
    # TypeScript 7 은 컴파일러가 Go 로 재작성되면서 기존 JS 컴파일러 API 가 빠졌다.
    # typescript-eslint(#10940)·Next.js 가 아직 그 API 에 의존해서 TS 7 로 올리면 lint·build 가 통째로 죽는다.
    # 두 도구가 지원을 발표하면 이 항목을 지우고 메이저 업그레이드를 별도 PR 로 검증한다.
    ignore:
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
      # ESLint 10 은 규칙 컨텍스트에서 `context.getFilename()` 을 제거했는데
      # eslint-plugin-react 가 아직 그 API 에 의존한다. 올리면 lint 가 통째로 죽는다:
      #   TypeError: Error while loading rule 'react/display-name':
      #   contextOrFilename.getFilename is not a function
      # (PR #73 에서 실측 — Lint 작업이 47초 만에 exit 2)
      # 플러그인이 ESLint 10 지원을 발표하면 이 항목을 지우고 메이저 업그레이드를
      # 별도 PR 로 검증한다. typescript 와 같은 이유·같은 처리다.
      - dependency-name: eslint
        update-types:
          - version-update:semver-major
      # Vitest 5 는 @storybook/addon-vitest 정식판(10.6)이 아직 받지 않는다 — peer 가
      # `vitest ^3 || ^4`, `@vitest/browser-playwright ^4` 까지다(5 지원은 11.0 알파뿐).
      # Dependabot 은 vitest 계열을 한 패키지씩 따로 올려서 버전이 어긋나고, Storybook
      # a11y 가 통째로 죽는다:
      #   SyntaxError: The requested module 'vitest/node' does not provide an export
      #   named 'BrowserConnectionError'
      # (PR #123 에서 실측 — browser-playwright 만 5 로 오른 상태)
      # Storybook 11 정식판이 나오면 이 항목을 지우고 vitest·@vitest/* 를 한 PR 에서 같이 올린다.
      - dependency-name: vitest
        update-types:
          - version-update:semver-major
      - dependency-name: "@vitest/*"
        update-types:
          - version-update:semver-major
    groups:
      production-minor-patch:
        dependency-type: production
        update-types:
          - minor
          - patch
      development-minor-patch:
        dependency-type: development
        update-types:
          - minor
          - patch
