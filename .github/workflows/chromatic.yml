name: Chromatic

# 디자인 시스템의 시각 회귀를 막고, 공개 Storybook 을 배포한다.
#
# 왜 필요한가:
# CI 의 `Storybook a11y` job 은 axe 로 "명백한 접근성 위반"만 잡는다. 버튼의
# padding 이 바뀌거나 카드 그림자가 사라져도 그 job 은 초록으로 통과한다.
# 눈으로 봐야 아는 변화는 스냅샷을 떠서 이전과 비교하는 수밖에 없다.
#
# 두 가지 일을 한다:
#   1. PR   — 스냅샷을 이전 baseline 과 비교해 바뀐 스토리를 보여준다.
#             의도한 변경이면 Chromatic UI 에서 승인하면 baseline 이 갱신된다.
#   2. main — 병합된 상태를 새 baseline 으로 삼고, 그 빌드를 공개 URL 로 배포한다.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: chromatic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  chromatic:
    name: Visual regression · Storybook 배포
    runs-on: ubuntu-latest

    # secrets 가 오지 않는 PR 에서는 건너뛴다 — 실행해도 인증에서 실패할 뿐이다.
    #
    # 두 경우를 **각각** 걸러야 한다. 처음에는 fork 조건만 두었는데,
    # dependabot 은 fork 가 아니라 **같은 레포에 브랜치를 딴다.** 그래서
    # head.repo 검사를 통과해 job 이 돌았고, 토큰만 빈 값이라
    # `✖ Missing project token` 으로 죽었다(PR #70~#74 전부 빨간불).
    #
    # ci.yml 의 E2E job 이 이미 같은 이유로 dependabot 을 명시적으로 거른다.
    if: >
      github.event_name == 'push' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.user.login != 'dependabot[bot]')

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Chromatic 은 "직전 빌드 이후 무엇이 바뀌었나"를 커밋 이력으로 찾는다.
          # 기본 얕은 클론(depth=1)이면 baseline 을 못 찾아 매번 전체를 변경으로
          # 표시한다.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Publish to Chromatic
        id: chromatic
        uses: chromaui/action@latest
        with:
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          workingDir: apps/page0127
          # 스토리북 빌드는 워크스페이스 스크립트를 그대로 쓴다.
          buildScriptName: build-storybook
          # main 에 병합된 것은 이미 리뷰를 거친 상태다. 여기서 또 승인을
          # 요구하면 다음 PR 이 전부 "변경됨"으로 뜬다.
          autoAcceptChanges: ${{ github.ref == 'refs/heads/main' }}
          # 스토리가 하나도 바뀌지 않은 커밋에서 과금·대기를 아낀다.
          exitZeroOnChanges: false
          onlyChanged: true

      - name: 결과 요약
        if: always()
        run: |
          {
            echo "## 🎨 Chromatic"
            echo ""
            echo "| 항목 | 값 |"
            echo "| --- | --- |"
            echo "| 📚 Storybook | ${{ steps.chromatic.outputs.storybookUrl }} |"
            echo "| 🔍 빌드 상세 | ${{ steps.chromatic.outputs.buildUrl }} |"
            echo "| 🖼 스토리 수 | ${{ steps.chromatic.outputs.specCount }} |"
            echo "| 🔀 변경된 스냅샷 | ${{ steps.chromatic.outputs.changeCount }} |"
          } >> "$GITHUB_STEP_SUMMARY"
