name: CI

# main 브랜치로의 PR과 push마다 lint / type-check / build를 자동 실행한다.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint · Type-check · Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Node 22 + npm 캐시(package-lock.json 해시 기준)로 설치 속도 확보
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # lockfile 기준 정확 재현 설치. package.json과 어긋나면 여기서 실패한다.
      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run type-check

      # 단위 테스트(vitest): 순수 함수만 검증하므로 서버·Supabase secrets가 필요 없다.
      # 브라우저 스모크(Playwright)는 별도 job으로 분리한다.
      - name: Unit test
        run: npm run test

      # 빌드는 OpenAI 클라이언트가 모듈 로드 시점에 키를 요구하므로 더미 값을 준다.
      # (실제 키는 Vercel에만 존재. CI는 컴파일 성공 여부만 검증한다.)
      - name: Build
        run: npm run build
        env:
          OPENAI_API_KEY: dummy

  # 브라우저 스모크(Playwright). quality와 독립적으로 병렬 실행된다.
  # 앱 렌더에 Supabase 공개 env가 필요하므로 secrets를 주입한다.
  # ⚠️ 운영이 아닌 "테스트/스테이징" Supabase 프로젝트 값을 secrets에 넣어야 안전하다.
  e2e:
    name: E2E smoke (Playwright)
    runs-on: ubuntu-latest

    # dependabot이 연 PR에서는 이 job을 건너뛴다.
    #
    # 학습 포인트:
    # - GitHub은 dependabot PR의 워크플로에 repository secrets를 전달하지 않는다.
    #   외부에서 받아온 새 의존성 코드가 설치·빌드되는 PR이라, secret이 유출될 수
    #   있기 때문이다(빈 값으로 넘어와 아래 검증 스텝에서 항상 실패했다).
    # - Dependabot 전용 secrets에 같은 값을 넣으면 통과시킬 수는 있으나,
    #   SUPABASE_SERVICE_ROLE_KEY는 RLS를 우회하는 DB 전체 권한 키라 그 방어를
    #   스스로 여는 셈이 된다. 그래서 등록 대신 job을 건너뛰는 쪽을 택했다.
    # - 의존성 업데이트 검증은 quality job(Lint·Type-check·Unit test·Build)이
    #   담당하고, 머지된 뒤 main push에서 E2E가 정상적으로 실행된다.
    # - actor가 아닌 PR 작성자로 판정한다. 사람이 재실행해도 값이 바뀌지 않는다.
    #   (push 이벤트에는 pull_request 컨텍스트가 없어 빈 값 → 조건 통과 → 실행됨)
    if: github.event.pull_request.user.login != 'dependabot[bot]'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # secrets가 실제로 이 job에 전달됐는지 먼저 확인한다(값은 노출하지 않고 SET/UNSET만).
      # 비어 있으면 여기서 즉시 실패 → webServer 120초 타임아웃 대신 원인이 바로 드러난다.
      - name: Check Supabase secrets present
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PRODUCTION_SUPABASE_URL: ${{ secrets.PRODUCTION_SUPABASE_URL }}
        run: |
          missing=0
          if [ -z "$NEXT_PUBLIC_SUPABASE_URL" ]; then
            echo "::error::NEXT_PUBLIC_SUPABASE_URL 이(가) 비어 있음 — repository secret 이름/스코프 확인 필요"
            missing=1
          else
            echo "NEXT_PUBLIC_SUPABASE_URL: SET (length=${#NEXT_PUBLIC_SUPABASE_URL})"
          fi
          if [ -z "$NEXT_PUBLIC_SUPABASE_ANON_KEY" ]; then
            echo "::error::NEXT_PUBLIC_SUPABASE_ANON_KEY 이(가) 비어 있음 — repository secret 이름/스코프 확인 필요"
            missing=1
          else
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY: SET (length=${#NEXT_PUBLIC_SUPABASE_ANON_KEY})"
          fi
          if [ -z "$PRODUCTION_SUPABASE_URL" ]; then
            echo "::error::PRODUCTION_SUPABASE_URL 이(가) 비어 있음 — 운영 DB 비교용 secret 필요"
            missing=1
          else
            echo "PRODUCTION_SUPABASE_URL: SET (length=${#PRODUCTION_SUPABASE_URL})"
          fi
          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::error::SUPABASE_SERVICE_ROLE_KEY 이(가) 비어 있음 — 개발/테스트 프로젝트 키 필요"
            missing=1
          else
            echo "SUPABASE_SERVICE_ROLE_KEY: SET (length=${#SUPABASE_SERVICE_ROLE_KEY})"
          fi
          exit $missing

      # 존재만 확인하면 "값이 있는데 틀린" 경우를 못 잡는다.
      #
      # 실제로 그런 일이 있었다: URL 과 키가 서로 다른 프로젝트 것이라 DB 에 전혀
      # 못 닿는 상태였는데, 위 검사는 3일 내내 "secrets 정상"이라고 표시했다.
      # E2E 는 앱이 DB 에러를 삼키는 덕분에 8개 중 7개가 통과했다.
      #
      # 그래서 한 번 호출해 본다. 401/403 이면 키가 그 URL 의 것이 아니다.
      #
      # 치는 곳은 PostgREST 루트(/rest/v1/)가 아니라 실제 테이블이어야 한다.
      # 루트는 OpenAPI 스키마 문서를 주는 service_role 전용 경로라, 멀쩡한 anon
      # 키로도 항상 401 이 난다("Only the `service_role` API key can be used for
      # this endpoint"). 반면 키가 진짜 틀리면 hint 가 "Double check your ..." 로
      # 달라진다 — 즉 루트로는 두 경우를 구분할 수 없다.
      # books 는 로그아웃 상태의 앱도 읽는 테이블이라, 앱이 실제로 쓰는 경로를 검증한다.
      - name: Verify Supabase credentials actually work
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          code=$(curl -sS -m 20 -o /tmp/supa.json -w '%{http_code}' \
            "${NEXT_PUBLIC_SUPABASE_URL}/rest/v1/books?select=id&limit=1" \
            -H "apikey: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${NEXT_PUBLIC_SUPABASE_ANON_KEY}" || echo "000")

          echo "PostgREST 응답: HTTP ${code}"

          # 200 = anon 권한으로 테이블을 읽었다(정상). 행이 0개여도 200 이다.
          # 그 외는 전부 문제로 본다.
          if [ "$code" != "200" ]; then
            echo "::error::Supabase 자격증명이 실제로는 동작하지 않는다 (HTTP ${code}). URL 과 키가 같은 프로젝트 것인지 확인할 것."
            head -c 300 /tmp/supa.json || true
            exit 1
          fi

          echo "자격증명 정상 — URL 과 키가 같은 프로젝트를 가리킨다"

      - name: Block production database in CI
        run: npm run check:non-production-db
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          PRODUCTION_SUPABASE_URL: ${{ secrets.PRODUCTION_SUPABASE_URL }}

      # 프로덕션 빌드. NEXT_PUBLIC_* 값은 이 시점에 번들에 박히므로 여기서 env를 준다.
      # (turbo strict env 모드라, 이 값들은 turbo.json build task의 env에도 선언돼 있어야 전달된다)
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          PRODUCTION_SUPABASE_URL: ${{ secrets.PRODUCTION_SUPABASE_URL }}
          OPENAI_API_KEY: dummy

      # Chromium 브라우저와 실행에 필요한 시스템 라이브러리를 설치한다.
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
        working-directory: apps/page0127

      # CI에선 reuseExistingServer:false → webServer가 next start로 새 서버를 띄운다.
      # (위 Build 산출물 .next를 사용)
      - name: Run E2E smoke
        run: npm run test:e2e -w page0127
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OPENAI_API_KEY: dummy
