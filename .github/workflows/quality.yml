name: quality

# 주 1회(월 09:00 KST) 자동 + 필요 시 수동으로 배포된 page0127의 품질을 측정해
# Supabase(quality_records/field_history)에 쌓는다. 측정은 무거워(Chrome+빌드) CI에서만 돈다.
on:
  schedule:
    - cron: '0 0 * * 1' # 매주 월 09:00 KST (UTC 00:00)
  workflow_dispatch: {}

# 실패 시 이슈를 열려면 필요하다. 기본 토큰은 contents: read 만 갖는다.
permissions:
  contents: read
  issues: write

jobs:
  measure:
    runs-on: ubuntu-latest
    # 5앵커 × 2폼팩터 × 3회 = 30 Lighthouse + next build + tsc/eslint. 여유 있게 45분.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # Lighthouse는 ubuntu-latest 사전설치 Chrome을 chrome-launcher가 자동 탐지해 쓴다.
      # 여기서 설치하는 건 measureRuntime(runtime.ts)이 쓰는 Playwright chromium이다.
      - name: Install Playwright chromium
        run: npx playwright install --with-deps chromium
        working-directory: apps/page0127

      # measure는 내부에서 apps/page0127를 next build 한다(measureBuild가 번들/코드건강 측정).
      # 따라서 빌드에 필요한 공개 env + OPENAI 더미 키를, 저장에 필요한 service_role과 함께 준다.
      - name: Measure quality
        run: npm run measure -w @repo/quality
        env:
          # 측정 대상 = 배포된 사이트 URL(Lighthouse/CrUX/SEO/runtime가 원격으로 접속)
          QUALITY_TARGET_URL: ${{ secrets.QUALITY_TARGET_URL }}
          # 저장(service_role은 RLS 우회) — store.ts가 이 두 "이름"을 읽는다.
          #
          # ⚠️ 값의 출처는 운영 전용 secret이다. GitHub secrets는 저장소에 이름이
          # 하나뿐이라 워크플로마다 다른 값을 줄 수 없는데, ci.yml의 e2e는 같은
          # 이름(NEXT_PUBLIC_SUPABASE_URL / SUPABASE_SERVICE_ROLE_KEY)을 개발 DB
          # 값으로 쓴다(운영을 건드리면 안 되므로). 여기서 그대로 받으면 품질
          # 기록이 개발 DB에 쌓여 운영 어드민 대시보드가 비게 된다.
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.PRODUCTION_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.PRODUCTION_SUPABASE_SERVICE_ROLE_KEY }}
          # 내부 next build가 요구하는 값들(공개 env는 번들에 박히고, OPENAI는 모듈 로드 시 필요).
          # 이 빌드는 번들 크기·코드건강 측정용이라 DB에 붙지 않는다 → 개발 값이어도 무방.
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          OPENAI_API_KEY: dummy
          # CrUX(없으면 필드 지표만 생략하고 측정은 계속). ?key= 방식.
          CRUX_API_KEY: ${{ secrets.CRUX_API_KEY }}

      # 실패를 이슈로 남긴다.
      #
      # 왜 메일로 충분하지 않나: 이 워크플로는 2026-08-03부터 4주 연속 빨간불이었는데
      # 아무도 몰랐다. schedule 실행의 실패 메일은 묻히기 쉽고, 주 1회라 대시보드가
      # 비어 있어도 "아직 측정 전이겠지"로 보인다. 이슈는 레포를 열면 보인다.
      #
      # 중복 방지: 같은 제목의 열린 이슈가 있으면 새로 만들지 않고 댓글만 단다.
      # (안 그러면 주마다 이슈가 하나씩 쌓인다)
      - name: 실패를 이슈로 알림
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: '🚨 주간 품질 측정 실패'
          # 중복 탐지용 검색어. 이모지는 검색 색인에서 신뢰할 수 없어 빼고 찾는다.
          SEARCH: '주간 품질 측정 실패'
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          body="주간 품질 측정(quality.yml)이 실패했습니다. \`/admin/quality\` 데이터가 이번 주치만큼 비어 있습니다.

          - 실행 로그: ${RUN_URL}
          - 커밋: \`${GITHUB_SHA}\`

          로그 맨 끝의 \`[quality] 실패:\` 줄이 원인입니다. 측정(Lighthouse)은 성공하고 마지막 저장만 실패하는 경우가 있으니 끝까지 확인하세요."

          # `// empty` 가 없으면 결과가 없을 때 문자열 "null" 이 잡혀 없는 이슈에 댓글을 시도한다.
          existing=$(gh issue list --state open --search "$SEARCH in:title" --json number --jq '.[0].number // empty')

          if [ -n "$existing" ]; then
            echo "기존 이슈 #${existing} 에 댓글을 답니다(중복 생성 방지)."
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$TITLE" --body "$body"
          fi
