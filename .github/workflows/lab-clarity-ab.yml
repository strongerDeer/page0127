name: lab-clarity-ab

# 일회성 실험: Clarity 허용/차단 모바일 TBT 비교 (scripts/lab/clarity-tbt-ab.mjs).
# 이 파일들을 고치는 PR 에서만 돈다. 운영 사이트를 읽기만 하고 DB·secret 은 쓰지 않는다.
on:
  pull_request:
    paths:
      - .github/workflows/lab-clarity-ab.yml
      - scripts/lab/clarity-tbt-ab.mjs
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Clarity 허용 vs 차단
        run: node scripts/lab/clarity-tbt-ab.mjs 5
