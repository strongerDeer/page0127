name: "1. 스테이징 배포"

# main 에 쌓인 변경을 운영에 내보내기 전에 staging(리허설용 미리보기) 하나로 확인한다.
# staging → production 으로 "승격"하는 흔한 방식을 브랜치 두 개(staging·release)로 한다.
#
# 흐름 (2026-11-03부터):
#   PR → main 머지 (운영 배포 안 함, 쌓기만)
#     → 이 워크플로: main 을 staging 브랜치로 복사 → Vercel 이 미리보기 1개를 만든다
#     → 미리보기에서 확인
#     → "2. 운영 배포" 워크플로: staging 을 release 로 → 운영 배포 1번 + 버전 태그
#
# 왜: 머지마다 운영 배포가 생겨 하루 10~20번 배포됐고, 배포가 쌓여 Vercel Hobby 의
# Functions Storage 한도(10GB)를 넘었다. 확인 없이 바로 운영에 나가는 것도 문제였다.
#
# 실행: GitHub → Actions → "1. 스테이징 배포" → Run workflow
# 자동: 매일 23:00 KST. main 이 staging 과 같으면(새로 머지된 게 없으면) 아무것도 안 한다.
#   GitHub 의 예약 실행은 붐비면 몇 분~수십 분 늦을 수 있다.
#   운영 배포(2번)는 자동으로 하지 않는다 — staging 을 보고 사람이 누른다.

on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 14 * * *" # 23:00 KST (UTC 14:00)

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  preview:
    name: main → staging
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: staging 을 main 으로 맞추기
        run: |
          set -euo pipefail
          MAIN_SHA=$(git rev-parse origin/main)
          STAGING_SHA=$(git rev-parse -q --verify origin/staging || true)
          if [ "$STAGING_SHA" = "$MAIN_SHA" ]; then
            echo "## 새로 머지된 변경이 없다 — 스테이징을 건너뛴다 (\`${MAIN_SHA:0:7}\`)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # staging 은 main 을 따라가기만 하는 브랜치다(사람이 커밋하지 않는다).
          # main 은 PR 로만 앞으로 가므로 이 push 는 항상 fast-forward 다
          # (staging·release 는 저장소 규칙으로 삭제·강제 push 가 막혀 있다).
          git push origin "${MAIN_SHA}:refs/heads/staging"

          {
            echo "## 스테이징 준비됨"
            echo
            echo "- 커밋: \`${MAIN_SHA:0:7}\`"
            echo "- 미리보기 주소(빌드 2~3분 뒤): https://page0127-git-staging-strongerdeers-projects.vercel.app"
            echo "  - Vercel 에 로그인한 브라우저에서만 열린다(미리보기 보호)."
            echo "- 확인이 끝나면 Actions → **2. 운영 배포** 를 실행한다."
            echo
            echo "### 이번에 나갈 변경"
            echo
            if git rev-parse -q --verify origin/release >/dev/null; then
              CHANGES=$(git log --no-merges --format='- %s' "origin/release..${MAIN_SHA}")
              echo "${CHANGES:-- (운영과 같다 — 나갈 변경이 없다)}"
            else
              echo "- (첫 릴리스 — release 브랜치가 아직 없다)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
